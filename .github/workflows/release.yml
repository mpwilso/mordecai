name: Release

# Builds the wheel and sdist for a published GitHub release, after checking that the release
# tag names the version in pyproject.toml, and keeps them as the run's artifact
# (docs/releasing.md). Publishing to PyPI was set up here on 2026-10-11, never used, and
# dropped on 2026-10-24. Third-party actions are pinned to full commit SHAs, with the version
# in a comment.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      # The release tag must name the version being built: v0.5.0 for version 0.5.0.
      - name: The tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG doesn't match version $version in pyproject.toml"
            exit 1
          fi
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

