name: CI

# Every branch push runs. A same-repo pull request already has that push run, so a pull request
# runs the jobs only when it comes from a fork.
on:
  push:
  pull_request:

# Read-only token, no secrets, and no pull_request_target: a pull request from a fork runs with
# nothing it could leak or write. Third-party actions are pinned to full commit SHAs, with the
# version in a comment; .github/dependabot.yml proposes updates.
permissions:
  contents: read

# A push to master always finishes, since the merge waits on it; a newer push cancels an older
# run on any other branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, so the test that checks the commits the docs cite can run.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # The engine on its own: no library extra, so the library's tests skip and
      # tests/test_engine_boundary.py shows identify, check and lint work without it.
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Brand files match scripts/brand.py
        run: uv run python scripts/brand.py --check
      - name: Planted suites match scripts/planted.py
        run: uv run python scripts/planted.py --check

  library:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # The library extra (the MCP SDK and strictyaml) and the reference validator, so every
      # library and MCP test runs.
      - name: Install
        run: uv sync --locked --extra library --group spec
      - name: Tests
        run: uv run pytest
