name: CI

on:
  push:
  pull_request:

# Read-only token, no secrets, and no pull_request_target: a pull request from a fork runs with
# nothing it could leak or write. Third-party actions are pinned to full commit SHAs, with the
# version in a comment; .github/dependabot.yml proposes updates.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Brand files match scripts/brand.py
        run: uv run python scripts/brand.py --check
      - name: Planted suites match scripts/planted.py
        run: uv run python scripts/planted.py --check
