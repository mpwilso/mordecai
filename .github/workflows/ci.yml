name: CI

# Every branch push runs. A same-repo pull request already has that push run, so a pull request
# runs the jobs only when it comes from a fork.
on:
  push:
  pull_request:

# Read-only token, no secrets, and no pull_request_target: a pull request from a fork runs with
# nothing it could leak or write. Third-party actions are pinned to full commit SHAs, with the
# version in a comment; .github/dependabot.yml proposes updates.
permissions:
  contents: read

# A push to master always finishes, since the merge waits on it; a newer push cancels an older
# run on any other branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
      # The engine on its own: no library extra, so the library's tests skip and
      # tests/test_engine_boundary.py shows identify, check and lint work without it. The
      # checkout is shallow, so tests/test_docs_commits.py skips here and runs in the library job.
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Brand files match scripts/brand.py
        run: uv run python scripts/brand.py --check
      - name: Planted suites match scripts/planted.py
        run: uv run python scripts/planted.py --check
      # The action in action.yml, on a recorded result. comment is off: a same-repo pull request
      # doesn't run these jobs, and pushes have no pull request to comment on, so posting is
      # untested until the action is used on a real pull request.
      - name: The action writes the card
        id: card
        uses: ./
        with:
          result: tests/fixtures/suite1-result.json
          skill: evals/planted/1-convention
          fail-on: hurts,invalid
          comment: "false"
      - name: The action's card is Markdown with the verdict
        env:
          CARD: ${{ steps.card.outputs.card }}
        run: |
          grep -q "^### planted-convention 1.0.0: Helps$" "$CARD"
      - name: The action fails on a fail-on verdict
        id: failing
        continue-on-error: true
        uses: ./
        with:
          result: tests/fixtures/suite1-result.json
          skill: evals/planted/1-convention
          fail-on: helps
          comment: "false"
      - name: It did fail
        if: steps.failing.outcome != 'failure'
        run: exit 1

  # The whole suite once, with the library extra, on the oldest supported Python; the checks job
  # covers the other versions for the engine. This job also has the full history and reports
  # coverage.
  library:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, so tests/test_docs_commits.py can check the commits the docs cite.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      # The library extra (the MCP SDK and strictyaml) and the reference validator, so every
      # library and MCP test runs.
      - name: Install
        run: uv sync --locked --extra library --group spec
      - name: Tests, under coverage
        run: uv run coverage run -m pytest
      - name: Coverage report in the job summary
        run: |
          {
            echo '```'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
